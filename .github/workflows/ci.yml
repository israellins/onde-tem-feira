name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  banco-e-e2e:
    name: Segurança do banco (RLS) e testes no navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sobe o Supabase local
        run: npx supabase start -x studio,edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta
      - name: Testes de RLS
        run: npm run test:db
      - name: Configura o app para o Supabase local
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } > .env.local
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Testes ponta a ponta
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
